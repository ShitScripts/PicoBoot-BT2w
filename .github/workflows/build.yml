name: Build PicoBoot BT 2W

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_call:

env:
  BUILD_TYPE: RelWithDebInfo
  PICO_SDK_VERSION: "2.3.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PicoBoot BT 2W (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            cmake \
            ninja-build \
            python3 \
            git \
            build-essential

      - name: Fetch Pico SDK (${{ env.PICO_SDK_VERSION }})
        run: |
          git clone --depth 1 --branch "${PICO_SDK_VERSION}" \
            https://github.com/raspberrypi/pico-sdk.git "${HOME}/pico-sdk"
          cd "${HOME}/pico-sdk"
          git submodule update --init

      - name: Download gekkoboot
        uses: robinraju/release-downloader@v1
        id: gekkoboot-download
        with:
          repository: 'webhdx/gekkoboot'
          latest: true
          fileName: '*.zip'
          out-file-path: gekkoboot
          extract: true

      - name: Copy gekkoboot.dol
        run: |
          cd gekkoboot
          if [ -f "gekkoboot.dol" ]; then
              cp gekkoboot.dol "${GITHUB_WORKSPACE}/payload.dol"
          else
              echo "gekkoboot.dol not found"
              exit 1
          fi

      - name: Build
        env:
          PICO_SDK_PATH: "${{ runner.home }}/pico-sdk"
        run: |
          tools/build.sh

      - name: Check firmware size (must be < 512 KB)
        run: |
          size=$(stat -c %s "build/pico2_w/dist/picoboot.bin")
          echo "firmware size: $size bytes"
          test "$size" -lt 524288

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picoboot-${{ steps.vars.outputs.sha_short }}
          path: dist/

      - name: Add build summary
        run: echo "$(cat .github/build_summary.md)" >> $GITHUB_STEP_SUMMARY